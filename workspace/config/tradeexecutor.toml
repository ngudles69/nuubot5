# =============================================================================
# NO SECRETS ALLOWED IN THIS FILE.
# =============================================================================

[server]
host = "127.0.0.1"
port = 6602

[network]
default = "testnet"
allow_mainnet = false

[hyperliquid]
min_order_notional_usdc = 11

[process]
poll_seconds = 10
request_timeout_seconds = 10
failure_threshold = 3
unresponsive_seconds = 30
restart_limit = 3
restart_interval_seconds = 600

[paths]
shared_data = "D:/workspace/data"
database = "workspace/db/nuubot.db"

[btrunner]
timer_interval_ms = 10000

[runtime]
max_cycles = 999999

[runtime.signaler]
kind = "macross"
signal_timeframe = "1h"
regime_timeframe = "4h"
fast_ma = 9
slow_ma = 21
rsi_period = 14
regime_ema = 200
volume_period = 20

[[runtime.executors]]
kind = "trade"
account_name = "sbacktest"
network = "simnet"
order_notional_usdc = "11"
take_profit_pct = "0.01"
stop_loss_pct = "0.01"
simulator_equity_usdc = "1000"
simulator_fee_pct = "0.05"
simulator_slippage_pct = "0.02"
persist_mode = "none"

[[runtime.risks]]
kind = "balanced"
