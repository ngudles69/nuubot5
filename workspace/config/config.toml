# =============================================================================
# NO SECRETS ALLOWED IN THIS FILE.
# =============================================================================

[server]
host = "127.0.0.1"
port = 6602

[network]
default = "testnet"
allow_mainnet = false

[hyperliquid]
min_order_notional_usdc = 11

[process]
poll_seconds = 10
request_timeout_seconds = 10
failure_threshold = 3
unresponsive_seconds = 30
restart_limit = 3
restart_interval_seconds = 600

[paths]
shared_data = "D:/workspace/data"
database = "workspace/db/nuubot.db"

[live]
controller_interval_ms = 1000
recon_interval_ms = 10000
recon_sweep_interval_ms = 60000
telemetry_interval_ms = 10000
telemetry_write_on_collect = true

[backtest]
controller_interval_ms = 1000
recon_interval_ms = 10000
recon_sweep_interval_ms = 60000
telemetry_interval_ms = 10000
telemetry_write_on_collect = false
